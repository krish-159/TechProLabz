<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techprolabz - Maker-Lab Inventory & Booking System</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="header-left">
            <button class="hamburger-menu" id="hamburger-menu" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="logo" id="logo-container">
                <img src="assets/logo.jpg" alt="Techprolabz Logo" id="logo-img">
            </div>
        </div>
        <nav id="main-nav" class="nav-collapsed">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="dashboard.html">Profile</a></li>
                <li><a href="booking.html">Book</a></li>
                <li><a href="#" id="logout">Logout</a></li>
            </ul>
        </nav>
        <div class="user-avatar-header" id="user-avatar-header">
            <img src="assets/image-1767696074354.png" alt="User Avatar" id="header-avatar">
        </div>
    </header>

    <!-- Logo Popup Modal -->
    <div class="logo-modal" id="logo-modal">
        <div class="logo-modal-content">
            <span class="logo-modal-close" id="logo-modal-close">&times;</span>
            <img src="assets/logo.jpg" alt="Techprolabz Logo Large">
        </div>
    </div>

    <div class="robotics-overlay"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <main>
        <section id="home" class="slider-section">
            <div class="hero-want-text">WANT</div>
            <div class="hero-question-mark">?</div>

            <div class="slider">
                <div class="slide active" data-equipment="3D Printer">
                    <div class="background">
                        <img src="assets/template.jpg" alt="Background">
                    </div>
                    <div class="content">
                        <div class="equipment-title-pill">
                            <h1>3D - Machines</h1>
                        </div>
                        <div class="techprolabz-badge">
                            <img src="assets/logo.jpg" alt="Techprolabz" class="badge-logo">
                            <span>TECHPROLABZ</span>
                        </div>
                        <p class="tagline">HAS IT ALL !</p>
                        <div class="button-group">
                            <button class="get-started">Get Started</button>
                            <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
                        </div>
                    </div>
                </div>
                <div class="slide" data-equipment="Robot Kits">
                    <div class="background">
                        <img src="assets/template.jpg" alt="Background">
                    </div>
                    <div class="content">
                        <div class="equipment-title-pill">
                            <h1>Robot Kits</h1>
                        </div>
                        <div class="techprolabz-badge">
                            <img src="assets/logo.jpg" alt="Techprolabz" class="badge-logo">
                            <span>TECHPROLABZ</span>
                        </div>
                        <p class="tagline">HAS IT ALL !</p>
                        <div class="button-group">
                            <button class="get-started">Get Started</button>
                            <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
                        </div>
                    </div>
                </div>
                <div class="slide" data-equipment="CNC Machine">
                    <div class="background">
                        <img src="assets/template.jpg" alt="Background">
                    </div>
                    <div class="content">
                        <div class="equipment-title-pill">
                            <h1>CNC Machine</h1>
                        </div>
                        <div class="techprolabz-badge">
                            <img src="assets/logo.jpg" alt="Techprolabz" class="badge-logo">
                            <span>TECHPROLABZ</span>
                        </div>
                        <p class="tagline">HAS IT ALL !</p>
                        <div class="button-group">
                            <button class="get-started">Get Started</button>
                            <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
                        </div>
                    </div>
                </div>
                <div class="slide" data-equipment="Drones">
                    <div class="background">
                        <img src="assets/template.jpg" alt="Background">
                    </div>
                    <div class="content">
                        <div class="equipment-title-pill">
                            <h1>Drones</h1>
                        </div>
                        <div class="techprolabz-badge">
                            <img src="assets/logo.jpg" alt="Techprolabz" class="badge-logo">
                            <span>TECHPROLABZ</span>
                        </div>
                        <p class="tagline">HAS IT ALL !</p>
                        <div class="button-group">
                            <button class="get-started">Get Started</button>
                            <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slider-controls">
                <div class="slider-dots">
                    <span class="dot-indicator active" data-slide="0"></span>
                    <span class="dot-indicator" data-slide="1"></span>
                    <span class="dot-indicator" data-slide="2"></span>
                    <span class="dot-indicator" data-slide="3"></span>
                </div>
            </div>
        </section>


    </main>

    <script src="script.js"></script>
    <script>
        // Check login status
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            // Redirect to login if not logged in
            window.location.href = 'login.html';
        } else {
            // Load user avatar
            const profile = JSON.parse(localStorage.getItem('profile_' + currentUser) || '{}');
            if (profile.avatar) {
                document.getElementById('header-avatar').src = profile.avatar;
            }
        }

        // Hamburger menu toggle
        const hamburgerMenu = document.getElementById('hamburger-menu');
        const mainNav = document.getElementById('main-nav');

        hamburgerMenu.addEventListener('click', function () {
            mainNav.classList.toggle('nav-collapsed');
            this.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', function (event) {
            if (!hamburgerMenu.contains(event.target) && !mainNav.contains(event.target)) {
                mainNav.classList.add('nav-collapsed');
                hamburgerMenu.classList.remove('active');
            }
        });

        // Logo modal
        const logoContainer = document.getElementById('logo-container');
        const logoModal = document.getElementById('logo-modal');
        const logoModalClose = document.getElementById('logo-modal-close');

        logoContainer.addEventListener('click', function () {
            logoModal.classList.add('show');
        });

        logoModalClose.addEventListener('click', function () {
            logoModal.classList.remove('show');
        });

        // Close modal when clicking outside
        logoModal.addEventListener('click', function (event) {
            if (event.target === logoModal) {
                logoModal.classList.remove('show');
            }
        });

        // User avatar click - navigate to dashboard
        document.getElementById('user-avatar-header').addEventListener('click', function () {
            window.location.href = 'dashboard.html';
        });

        // Logout
        document.getElementById('logout').addEventListener('click', function () {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
