<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Equipment - Techprolabz</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="assets/logo.jpg" alt="Techprolabz Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="dashboard.html">Profile</a></li>
                <li><a href="booking.html">Book</a></li>
                <li><a href="#" id="logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="robotics-overlay"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <main>
        <section id="equipment-list">
            <h2>Equipment List</h2>
            <div class="equipment-grid">
                <!-- Equipment items will be populated by JS -->
            </div>
        </section>

        <section id="booking">
            <div class="booking-container">
                <div class="booking-header">
                    <h2>Book Equipment</h2>
                    <p class="booking-subtitle">Reserve your equipment for the perfect time slot</p>
                </div>

                <form id="booking-form" class="modern-booking-form">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="equipment-select">
                                <i class="icon">🔧</i>
                                Select Equipment
                            </label>
                            <select id="equipment-select" required>
                                <option value="">Choose equipment...</option>
                                <option value="3D Printer">🖨️ 3D Printer</option>
                                <option value="Robot Kits">🤖 Robot Kits</option>
                                <option value="CNC Machine">⚙️ CNC Machine</option>
                                <option value="Drones">🚁 Drones</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="date">
                                <i class="icon">📅</i>
                                Date
                            </label>
                            <input type="date" id="date" required>
                        </div>

                        <div class="form-group">
                            <label for="start-time">
                                <i class="icon">🕐</i>
                                Start Time
                            </label>
                            <input type="time" id="start-time" min="09:00" max="17:00" required>
                            <span class="helper-text">9:00 AM - 5:00 PM</span>
                        </div>

                        <div class="form-group">
                            <label for="end-time">
                                <i class="icon">🕔</i>
                                End Time
                            </label>
                            <input type="time" id="end-time" min="09:00" max="17:00" required>
                            <span class="helper-text">9:00 AM - 5:00 PM</span>
                        </div>
                    </div>

                    <div id="availability-status" class="availability-status hidden">
                        <span class="status-icon">✓</span>
                        <span class="status-text">Available</span>
                    </div>

                    <button type="submit" class="book-now-btn">
                        <span class="btn-text">Book Now</span>
                        <span class="btn-icon">→</span>
                    </button>
                </form>
            </div>
        </section>

        <section id="history">
            <div class="history-container">
                <div class="history-header">
                    <h2>Your Bookings</h2>
                    <span class="booking-count" id="booking-count">0 bookings</span>
                </div>
                <div id="history-list" class="history-grid">
                    <!-- History will be populated by JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script>
        // Check login status
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            // Redirect to login if not logged in
            window.location.href = 'login.html';
        } else {
            loadEquipment();
            loadHistory();
        }

        // Logout
        document.getElementById('logout').addEventListener('click', function () {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        // Handle booking form
        document.getElementById('booking-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const equip = document.getElementById('equipment-select').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            // Check if slot is available
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const conflict = bookings.find(b => b.equipment === equip && b.date === date && b.time === time);
            if (conflict) {
                showWarning('This time slot is already booked. Please choose a different time.', 'Slot Unavailable');
                return;
            }

            // Save booking
            const booking = { user: currentUser, equipment: equip, date, time };
            bookings.push(booking);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            showSuccess('Your equipment has been booked successfully!', 'Booking Confirmed!');
            loadHistory();
            this.reset();
        });

        // Pre-select equipment from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const equipmentParam = urlParams.get('equipment');
        if (equipmentParam) {
            const equipmentSelect = document.getElementById('equipment-select');
            // Try to find and select the matching option
            for (let option of equipmentSelect.options) {
                if (option.value === equipmentParam) {
                    option.selected = true;
                    break;
                }
            }
        }

        // Real-time availability checking
        function checkAvailability() {
            const equip = document.getElementById('equipment-select').value;
            const date = document.getElementById('date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const statusDiv = document.getElementById('availability-status');

            // Only check if all fields are filled
            if (!equip || !date || !startTime || !endTime) {
                statusDiv.classList.add('hidden');
                return;
            }

            // Validate time range
            if (startTime >= endTime) {
                statusDiv.classList.remove('hidden', 'available');
                statusDiv.classList.add('unavailable');
                statusDiv.innerHTML = '<span class="status-icon">⚠️</span><span class="status-text">End time must be after start time</span>';
                return;
            }

            // Convert time strings to minutes
            const timeToMinutes = (time) => {
                const [hours, minutes] = time.split(':').map(Number);
                return hours * 60 + minutes;
            };

            const newStart = timeToMinutes(startTime);
            const newEnd = timeToMinutes(endTime);

            // Check for conflicts
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const conflict = bookings.find(b => {
                if (b.equipment === equip && b.date === date) {
                    const existingStart = timeToMinutes(b.startTime);
                    const existingEnd = timeToMinutes(b.endTime);
                    return (newStart < existingEnd && newEnd > existingStart);
                }
                return false;
            });

            if (conflict) {
                statusDiv.classList.remove('hidden', 'available');
                statusDiv.classList.add('unavailable');
                statusDiv.innerHTML = `<span class="status-icon">❌</span><span class="status-text">Unavailable - Already booked ${conflict.startTime} - ${conflict.endTime}</span>`;
            } else {
                statusDiv.classList.remove('hidden', 'unavailable');
                statusDiv.classList.add('available');
                statusDiv.innerHTML = '<span class="status-icon">✓</span><span class="status-text">Available - Ready to book!</span>';
            }
        }

        // Add event listeners for real-time checking
        document.getElementById('equipment-select').addEventListener('change', checkAvailability);
        document.getElementById('date').addEventListener('change', checkAvailability);
        document.getElementById('start-time').addEventListener('change', checkAvailability);
        document.getElementById('end-time').addEventListener('change', checkAvailability);
    </script>
</body>

</html>
