<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Equipment - Techprolabz</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="assets/logo.jpg" alt="Techprolabz Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="dashboard.html">Profile</a></li>
                <li><a href="booking.html">Book</a></li>
                <li><a href="#" id="logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="robotics-overlay"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <main>
        <section id="equipment-list">
            <h2>Equipment List</h2>
            <div class="equipment-grid">
                <!-- Equipment items will be populated by JS -->
            </div>
        </section>

        <section id="booking">
            <h2>Book Equipment</h2>
            <form id="booking-form">
                <label for="equipment-select">Select Equipment:</label>
                <select id="equipment-select" required>
                    <option value="3D Printer">3D Printer</option>
                    <option value="Robot Kits">Robot Kits</option>
                    <option value="CNC Machine">CNC Machine</option>
                    <option value="Drones">Drones</option>
                </select>
                <label for="date">Date:</label>
                <input type="date" id="date" required>
                <label for="start-time">Start Time:</label>
                <input type="time" id="start-time" min="09:00" max="17:00" required>
                <label for="end-time">End Time:</label>
                <input type="time" id="end-time" min="09:00" max="17:00" required>
                <button type="submit">Book Now</button>
            </form>
        </section>

        <section id="history">
            <h2>Booking History</h2>
            <ul id="history-list">
                <!-- History will be populated by JS -->
            </ul>
        </section>
    </main>

    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script>
        // Check login status
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            // Redirect to login if not logged in
            window.location.href = 'login.html';
        } else {
            loadEquipment();
            loadHistory();
        }

        // Logout
        document.getElementById('logout').addEventListener('click', function () {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        // Handle booking form
        document.getElementById('booking-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const equip = document.getElementById('equipment-select').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            // Check if slot is available
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const conflict = bookings.find(b => b.equipment === equip && b.date === date && b.time === time);
            if (conflict) {
                showWarning('This time slot is already booked. Please choose a different time.', 'Slot Unavailable');
                return;
            }

            // Save booking
            const booking = { user: currentUser, equipment: equip, date, time };
            bookings.push(booking);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            showSuccess('Your equipment has been booked successfully!', 'Booking Confirmed!');
            loadHistory();
            this.reset();
        });
    </script>
</body>

</html>
