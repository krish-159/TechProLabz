<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Techprolabz</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Custom styles for login page */
        .navbar {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: transparent;
            -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
            border-bottom: 1px solid transparent;
            box-shadow: none;
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar:hover {
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .navbar .logo img {
            height: 55px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            cursor: pointer;
            border-radius: 8px;
            opacity: 0;
        }

        .navbar:hover .logo img {
            opacity: 1;
        }

        .navbar .logo img:hover {
            transform: scale(1.15) rotate(3deg);
            filter: drop-shadow(0 8px 20px rgba(255, 255, 255, 0.4)) brightness(1.1);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .signup-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            position: relative;
            overflow: hidden;
            opacity: 0;
        }

        .navbar:hover .signup-btn {
            opacity: 1;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .signup-btn:hover::before {
            left: 100%;
        }

        .signup-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.5);
            background: linear-gradient(135deg, #20c997 0%, #28a745 100%);
        }

        .signup-btn:active {
            transform: translateY(-1px);
        }

        .container {
            display: flex;
            min-height: 80vh;
            align-items: center;
            justify-content: space-between;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .left {
            flex: 1;
            text-align: center;
        }

        .robot {
            max-width: 350px;
            width: 100%;
            height: auto;
            filter: brightness(1.1) contrast(1.1);
            object-fit: contain;
        }

        .right {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
        }

        .login-card h3 {
            margin-bottom: 0.5rem;
            color: #007bff;
            font-size: 1rem;
        }

        .login-card input[type="text"],
        .login-card input[type="password"],
        .login-card input[type="email"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .login-card input[type="checkbox"] {
            vertical-align: middle;
            margin: 0;
        }

        .login-card input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .options a {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #0056b3;
        }

        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: -1;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                text-align: center;
            }

            .left,
            .right {
                flex: none;
                width: 100%;
            }

            .robot {
                max-width: 80%;
            }

            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                margin: 1rem 0;
            }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <img src="assets/logo.jpg" alt="Techprolabz Logo">
        </div>
        <button class="signup-btn" onclick="window.location.href='signup.html'">Sign Up</button>
    </nav>

    <div class="robotics-overlay"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- MAIN SECTION -->
    <section class="container">

        <!-- ROBOT SIDE -->
        <div class="left">
            <img src="assets/image2.jpg" class="robot" alt="Robot">
        </div>

        <!-- LOGIN CARD -->
        <div class="right">
            <div class="login-card">
                <h3>Email ID / Phone No.</h3>
                <input type="text" id="email" placeholder="Enter email or phone" required>

                <h3>Password</h3>
                <input type="password" id="password" placeholder="Enter password" required>

                <div class="options">
                    <label>
                        <input type="checkbox" id="agree"> I agree to <a href="terms.html" target="_blank">Terms &
                            Privacy Policy</a>
                    </label>
                </div>

                <button class="login-btn" id="login-submit" type="button">Login</button>
            </div>
        </div>

    </section>

    <script src="toast.js"></script>

    <!-- WAVE -->
    <img src="assets/template.jpg" class="wave" alt="Wave">

    <script>
        // Check if already logged in
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            window.location.href = 'dashboard.html';
        }

        // Login functionality
        document.getElementById('login-submit').addEventListener('click', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const agree = document.getElementById('agree').checked;

            if (!agree) {
                showWarning('Please agree to Terms & Privacy Policy to continue.', 'Agreement Required');
                return;
            }

            // Get users
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', user.username);
                window.location.href = 'dashboard.html';
            } else {
                showError('The email or password you entered is incorrect. Please try again.', 'Login Failed');
            }
        });
    </script>
</body>

</html>
